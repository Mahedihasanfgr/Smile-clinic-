<style>
:root{--ink:#0c2742;--blue:#1d5fa8;--sky:#dcebf6;--paper:#f6f9fb;--white:#fff;--amber:#e9a23b;--amber-d:#b97614;--line:#c9d9e6;--muted:#4b6177;--wa:#1faa59;
--serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.65;font-size:17px;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}a{color:inherit}

.wrap{max-width:1180px;margin:0 auto;padding:0 22px}

p{max-width:62ch}
section{padding:92px 0}

header{position:sticky;top:0;z-index:50;background:rgba(246,249,251,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}

/* hero */
.hero{padding:48px 0 72px;background:
linear-gradient(var(--line) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/48px 48px,var(--sky);background-blend-mode:normal;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--sky) 0%,rgba(220,235,246,.86) 45%,rgba(220,235,246,.35) 100%);pointer-events:none}
.hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.hero p.lead{font-size:1.2rem;margin:22px 0 32px;color:#1f3b57}
.cta-row{display:flex;flex-wrap:wrap;gap:14px}
.hero-badges{display:flex;flex-wrap:wrap;gap:12px 26px;margin-top:34px;font-weight:600;font-size:.95rem}
.hero-badges span{display:flex;align-items:center;gap:8px}
.hero-badges b{color:var(--amber-d)}
.arch{position:relative;justify-self:center;width:min(100%,400px)}
.arch img{width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;object-position:50% 58%;border-radius:999px 999px 24px 24px;border:8px solid #fff;box-shadow:0 28px 60px -24px rgba(12,39,66,.45)}
.arch svg.smile{position:absolute;left:-44px;right:-44px;bottom:70px;width:calc(100% + 88px);pointer-events:none;overflow:visible}
.smile path{fill:none;stroke:var(--amber);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:640;stroke-dashoffset:640;animation:draw 2.2s .4s ease forwards}
.smile .dim{stroke:var(--blue);stroke-width:1.4;stroke-dasharray:4 5;stroke-dashoffset:0;animation:none;opacity:.8}

@keyframes draw{to{stroke-dashoffset:0}}
.stamp{position:absolute;top:30px;right:-20px;background:var(--ink);color:#fff;border-radius:18px;padding:12px 16px;font-size:.8rem;line-height:1.3;box-shadow:0 12px 28px -10px rgba(0,0,0,.4)}
.stamp b{display:block;font-family:var(--serif);font-size:1.05rem;color:var(--amber)}
/* proof */
.proof{background:var(--ink);color:#fff;padding:34px 0}
.proof .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;text-align:left}
.proof div{border-left:2px solid var(--amber);padding-left:16px}
.proof strong{font-family:var(--serif);font-size:1.9rem;display:block;line-height:1.1}
.proof span{font-size:.92rem;opacity:.8}
/* services */
.head{display:flex;justify-content:space-between;align-items:end;gap:30px;flex-wrap:wrap;margin-bottom:38px}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.tab{padding:11px 22px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font:inherit;font-weight:700;cursor:pointer;color:var(--muted)}
.tab[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.panel{display:grid;grid-template-columns:1fr 1.3fr;gap:44px;background:#fff;border:1px solid var(--line);border-radius:28px;padding:40px}
.panel h3{font-size:1.9rem;margin-bottom:12px}.panel p{color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;list-style:none;padding:0;align-content:start}
.chips li{padding:13px 16px;background:var(--paper);border-radius:12px;font-weight:600;font-size:.97rem;display:flex;gap:10px;align-items:center}
.chips li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none}
/* invisalign */
.inv{background:var(--sky)}
.inv .grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:center}
.inv img{height:auto;border-radius:24px;aspect-ratio:3/4;object-fit:cover;width:100%;max-height:560px;box-shadow:0 24px 50px -24px rgba(12,39,66,.5)}
.steps{list-style:none;padding:0;margin:30px 0;counter-reset:s;border-left:2px dashed var(--blue);margin-left:14px}
.steps li{counter-increment:s;position:relative;padding:0 0 22px 34px}
.steps li::before{content:counter(s);position:absolute;left:-15px;top:0;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;font-size:.85rem;display:grid;place-items:center}
.steps b{display:block;font-size:1.05rem}.steps span{color:var(--muted);font-size:.96rem}
/* doctors */
.docs{display:grid;grid-template-columns:repeat(2,1fr);gap:28px;max-width:980px}
.doc{background:#fff;border:1px solid var(--line);border-radius:28px;padding:36px}
.doc .ini{width:68px;height:68px;border-radius:50%;background:var(--ink);color:var(--amber);font-family:var(--serif);font-size:1.6rem;font-weight:700;display:grid;place-items:center;margin-bottom:18px}
.doc .deg{color:var(--blue);font-weight:700;margin:4px 0 14px}.doc p{color:var(--muted)}
/* kids */
.kids .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
.kids img{height:auto;border-radius:28px;width:100%;aspect-ratio:3/4;object-fit:cover;max-height:560px;object-position:top}
.kids ul{margin:22px 0 28px;padding:0;list-style:none;display:grid;gap:10px}
.kids li{padding-left:30px;position:relative}.kids li::before{content:"✓";position:absolute;left:0;color:var(--amber-d);font-weight:800}
/* gallery */
.gal{display:grid;grid-template-columns:1.4fr 1fr 1fr;grid-template-rows:260px 260px;gap:16px}
.gal figure{position:relative;border-radius:22px;overflow:hidden;background:var(--sky)}
.gal figure:first-child{grid-row:span 2}
.gal img{width:100%;height:100%;object-fit:cover}
.gal figcaption{position:absolute;left:14px;bottom:14px;background:rgba(12,39,66,.85);color:#fff;font-size:.85rem;font-weight:600;padding:6px 14px;border-radius:999px}
/* reviews */
.rev{background:var(--ink);color:#fff}
.rev h2{color:#fff}.rev .head p{color:#b9cde0}
.score{display:flex;align-items:center;gap:16px}.score strong{font-family:var(--serif);font-size:4rem;line-height:1;color:var(--amber)}
.stars{color:var(--amber);letter-spacing:3px}
.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.quotes blockquote{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:22px;padding:28px}
.quotes blockquote:nth-child(2){transform:translateY(18px)}
.quotes p{font-family:var(--serif);font-size:1.2rem;line-height:1.45;margin:12px 0 14px}
.quotes cite{font-style:normal;font-size:.88rem;color:#b9cde0}
/* faq */
.faq{max-width:820px}
details{border-bottom:1px solid var(--line);padding:20px 0}
summary{cursor:pointer;font-family:var(--serif);font-size:1.2rem;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:20px}
summary::-webkit-details-marker{display:none}summary::after{content:"+";font-size:1.6rem;line-height:1;color:var(--amber-d)}
details[open] summary::after{content:"–"}
details p{margin-top:12px;color:var(--muted)}
/* book */
.book{background:var(--sky)}
.book .grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px}
form{background:#fff;border-radius:28px;padding:36px;display:grid;gap:16px;border:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{font-weight:700;font-size:.92rem;display:grid;gap:6px}
input,select,textarea{font:inherit;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:3px solid var(--amber);border-color:var(--amber)}
.info{display:grid;gap:20px;margin-top:28px}
.info div{display:flex;gap:14px}.info svg{flex:none;width:26px;height:26px;color:var(--blue)}
.info b{display:block}.info small{color:var(--muted);font-size:.95rem}
.todo{background:#fff6e4;border:1px dashed var(--amber-d);padding:2px 8px;border-radius:6px;font-weight:600}
footer{background:#07182b;color:#b9cde0;padding:48px 0 100px;font-size:.93rem}
footer .wrap{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap}
footer a{text-decoration:none;margin-right:18px}footer a:hover{color:#fff}
footer .brand{color:#fff;margin-bottom:10px}
.sticky{display:none}
@media (max-width:900px){
section{padding:64px 0}
.nav ul{display:none;position:absolute;top:68px;left:0;right:0;background:var(--paper);flex-direction:column;padding:18px 22px;gap:16px;border-bottom:1px solid var(--line)}
.nav ul.open{display:flex}.menu-btn{display:block}.nav>.btn{display:none}
.hero .wrap,.inv .grid,.kids .grid,.book .grid,.panel,.docs{grid-template-columns:1fr}
.arch{width:min(72%,300px);margin-top:8px}.arch img{aspect-ratio:4/5;max-height:52vh}.arch svg.smile{display:none}.stamp{right:-10px}
.proof .wrap{grid-template-columns:repeat(2,1fr)}
.quotes{grid-template-columns:1fr}.quotes blockquote:nth-child(2){transform:none}
.gal{grid-template-columns:1fr 1fr;grid-template-rows:240px 200px 200px}.gal figure:first-child{grid-column:span 2;grid-row:auto}
.row,.chips{grid-template-columns:1fr}.panel{padding:26px}
.sticky{display:grid;grid-template-columns:1fr 1fr;position:fixed;bottom:0;left:0;right:0;z-index:60;gap:1px;background:var(--ink)}
.sticky a{padding:15px;text-align:center;font-weight:700;text-decoration:none;color:#fff}.sticky a:first-child{background:var(--ink)}.sticky a:last-child{background:var(--wa)}
}
@media (prefers-reduced-motion:reduce){.smile path{animation:none;stroke-dashoffset:0}*{scroll-behavior:auto!important;transition:none!important}}

/* ===== motion & polish layer ===== */
#intro{position:fixed;inset:0;z-index:200;background:var(--ink);display:grid;place-content:center;justify-items:center;gap:14px;transition:transform .9s cubic-bezier(.77,0,.18,1) .15s,visibility 0s 1.1s}
#intro svg{width:150px;overflow:visible}#intro path{fill:none;stroke-linecap:round;stroke-width:5}
#intro .a{stroke:#fff;opacity:.15}#intro .b{stroke:var(--amber);stroke-dasharray:200;stroke-dashoffset:200;animation:draw 1.1s .2s ease forwards}

@keyframes fin{to{opacity:1}}
body.ready #intro{transform:translateY(-101%);visibility:hidden}
body:not(.ready){overflow:hidden}
#bar{position:fixed;top:0;left:0;height:3px;width:100%;background:var(--amber);transform:scaleX(0);transform-origin:0 50%;z-index:90}
header{transition:box-shadow .3s,background .3s}header.sc{box-shadow:0 8px 30px -18px rgba(12,39,66,.5)}
.nav ul a{position:relative;padding:6px 0}
.nav ul a::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--amber);transform:scaleX(0);transform-origin:0 50%;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.nav ul a:hover::after,.nav ul a.on::after{transform:scaleX(1)}.nav ul a.on{color:var(--ink)}
.btn{position:relative;overflow:hidden;isolation:isolate;transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s,background .25s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);z-index:-1}
.btn:hover::after{transform:translateX(120%);transition:transform .7s}
.btn-primary:hover{box-shadow:0 14px 30px -12px rgba(233,162,59,.9)}
.btn:active{transform:scale(.97)}
/* hero text */
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.1em}
.w>span{display:inline-block;transform:translateY(110%);transition:transform .9s cubic-bezier(.2,.7,.2,1)}

.hero .lead,.hero .cta-row,.hero-badges{opacity:0;transform:translateY(18px);transition:opacity .8s,transform .8s}

body.ready .hero-badges{opacity:1;transform:none;transition-delay:1.9s}
.hero{animation:grid 40s linear infinite}
@keyframes grid{to{background-position:48px 48px,48px 48px,0 0}}
.arch{transition:transform .25s ease-out;will-change:transform}
.arch img{clip-path:inset(100% 0 0 0 round 999px 999px 24px 24px);transition:clip-path 1.3s cubic-bezier(.77,0,.18,1) .8s}

.stamp{opacity:0;transition:opacity .6s 2s}body.ready .stamp{opacity:1;animation:bob 5s 2.6s ease-in-out infinite}

/* marquee */
.marq{background:var(--amber);color:var(--ink);overflow:hidden;white-space:nowrap;padding:16px 0;font:600 1.35rem var(--serif);transform:rotate(-1.2deg);margin:-6px -20px 6px;position:relative;z-index:2}
.mt{display:inline-flex;align-items:center;gap:28px;animation:mq 38s linear infinite}.marq:hover .mt{animation-play-state:paused}

/* reveals */
.js .rv{opacity:0;transform:translateY(34px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--d,0)*90ms)}
.js .rv.in{opacity:1;transform:none}
.js .ci{clip-path:inset(0 100% 0 0 round 24px);transform:scale(1.2);transition:clip-path 1.2s cubic-bezier(.77,0,.18,1),transform 1.6s cubic-bezier(.2,.7,.2,1)}

/* proof */
.proof div{transition:border-color .3s,transform .3s}.proof div:hover{transform:translateX(6px)}
/* services */
.tab{transition:background .3s,color .3s,border-color .3s,transform .2s}.tab:hover{transform:translateY(-2px);border-color:var(--blue)}
.panel>*{animation:pin .6s cubic-bezier(.2,.7,.2,1) both}.chips li{animation:pin .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*45ms)}

.doc h3,.doc .deg,.doc p{margin-left:30px;margin-right:30px}.doc h3{margin-top:26px}.doc p{margin-bottom:30px}

.gal figure img{transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}.gal figure:hover img{transform:scale(1.07)}
.gal figcaption{transform:translateY(8px);opacity:0;transition:.4s}.gal figure:hover figcaption{transform:none;opacity:1}

.inv,.rev,.book{position:relative}
.inv::before,.rev::before,.book::before{content:"";position:absolute;top:-1px;left:0;right:0;height:46px;background:var(--paper);border-radius:0 0 50% 50%/0 0 100% 100%}
.inv{padding-top:130px}.rev{padding-top:130px}.book{padding-top:130px}
/* reviews */

.btn-wa:hover{box-shadow:0 14px 30px -12px rgba(31,170,89,.8)}
.ok{display:none;background:#e7f7ee;color:#0d6b37;padding:14px 16px;border-radius:12px;font-weight:600}.ok.show{display:block;animation:pin .5s both}

@media (prefers-reduced-motion:reduce){
#intro{display:none}body:not(.ready){overflow:auto}
